<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام محاسبة أمي الغالية</title>
    <!-- 🔗 ربط ملف التصميم والألوان الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🏪 نظام إدارة مخزون ومبيعات المحل</h1>

    <div class="grid">
        <!-- القسم الأول: إدارة المخزون -->
        <div class="card">
            <h2>📦 إضافة بضاعة جديدة للمخزن</h2>
            <div class="form-group">
                <label>اسم المنتج (عطر، منشفة، ملابس):</label>
                <input type="text" id="pName" placeholder="مثال: عطر ياسمين الشام">
            </div>
            <div class="form-group">
                <label>المقاس / الحجم / اللون:</label>
                <input type="text" id="pSize" placeholder="مثال: قطن 100% - لون أبيض">
            </div>
            <div class="form-group">
                <label>سعر مبيع القطعة الواحده:</label>
                <input type="number" id="pPrice" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>الكمية المتوفرة حالياً:</label>
                <input type="number" id="pStock" placeholder="0">
            </div>
            <button class="btn-success" onclick="addProduct()">حفظ المنتج في المخزن ✨</button>

            <h3>القطع المتوفرة في الرفوف</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>المواصفات</th>
                        <th>السعر</th>
                        <th>المخزون</th>
                    </tr>
                </thead>
                <tbody id="productsTable"></tbody>
            </table>
        </div>

        <!-- القسم الثاني: شاشة البيع السريع -->
        <div class="card">
            <h2>💰 شاشة الفواتير والبيع السريع</h2>
            <div class="form-group">
                <label>اختر المنتج المراد بيعه:</label>
                <select id="saleProductSelect">
                    <option value="">-- اختر من المخزن --</option>
                </select>
            </div>
            <div class="form-group">
                <label>الكمية المباعة:</label>
                <input type="number" id="saleQty" value="1" min="1">
            </div>
            <button class="btn-primary" onclick="makeSale()">تسجيل عملية البيع وقص الفاتورة 🛒</button>

            <div class="total-box" id="totalEarningsBox">
                إجمالي أرباح المحل اليوم: 0 ل.س
            </div>

            <h3>سجل مبيعات اليوم</h3>
            <table>
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>الكمية</th>
                        <th>الإجمالي</th>
                    </tr>
                </thead>
                <tbody id="salesTable"></tbody>
            </table>
        </div>
    </div>

    <!-- 🔗 ربط ملف العمليات الحسابية الخارجي قبل إغلاق كود الصفحة -->
    <script src="script.js"></script>
</body>
</html>
